; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
board_build.fcpu = 600000000
monitor_speed = 115200
monitor_filters = send_on_enter

lib_deps =
	arkhipenko/TaskScheduler@^3.7.0
	adafruit/Adafruit TCS34725@^1.4.4

	; Uncomment these as you wire up more of the parts kit:
	; pololu/VL53L0X@^1.3.1                    ; single-zone TOF
	; pololu/VL53L1X@^1.3.1                    ; single-zone TOF (longer range)
	; sparkfun/SX1509 IO Expander@^3.0.5       ; I2C IO expander (TOF XSHUT lines etc.)
	; adafruit/Adafruit BNO055@^1.6.3          ; IMU
	; adafruit/Adafruit Unified Sensor@^1.1.14 ; required by Adafruit BNO055
	; cesarvandevelde/HerkulexServo@^0.1.0     ; smart servo (gripper)
	; fastled/FastLED@^3.7.0                   ; addressable LED strip
